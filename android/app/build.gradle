plugins { id 'com.android.application' }
android {
    namespace 'com.yixu.reading'
    compileSdk 34
    ndkVersion '28.2.13676358'
    defaultConfig { applicationId 'com.yixu.reading'; minSdk 26; targetSdk 34; versionCode 1; versionName '0.1.0'; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    sourceSets {
        main { assets.srcDirs = [project.findProperty('yixuAssets') ?: 'src/main/assets', rootProject.file('../.local/android-voice'), rootProject.file('../.local/native-license-assets'), rootProject.file('../.local/native-core-assets')] }
        debug { assets.srcDirs += rootProject.file('../.local/native-probe-assets') }
    }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'
    implementation files(rootProject.file('../.local/vendor/sherpa/sherpa-onnx-static-link-onnxruntime-1.13.8.aar'))
}
